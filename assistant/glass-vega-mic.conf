# Микрофон для ассистента glass — два источника из одного fifine, оба: WebRTC-шумодав, срез низа (гул, топот)
# и эхоподавление по тому, что играет из колонок (перебить её голосом).
#  • «glass_vega_mic» — дальний: ещё и автоусиление (тихий голос с другого конца комнаты). Для режима AOD.
#  • «glass_vega_near» — ближний, без автоусиления: голос у микрофона громкий, а дальний разговор, музыка и
#    телевизор остаются тихими, и порог громкости в службе (stt.NEAR_MIN) их отсекает. Обычный режим.
# Отдельный процесс PipeWire (служба glass-vega-mic), основной звук не трогает; по умолчанию в системе остаётся
# сам fifine (priority.session ниже).
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true                 # эталон — то, что играет на выходе по умолчанию
            aec.args = {
                webrtc.gain_control = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.transient_suppression = true    # щелчки клавиатуры
                webrtc.voice_detection = false
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "glass_vega_capture"
                target.object = "alsa_input.usb-3142_fifine_Microphone-00.analog-stereo"
                node.passive = true
            }
            source.props = {
                node.name = "glass_vega_mic"
                node.description = "Vega mic (noise suppression, gain, echo cancel)"
                priority.session = 100
                priority.driver = 100
            }
        }
    }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true                 # эталон — то, что играет на выходе по умолчанию
            aec.args = {
                webrtc.gain_control = false               # ближний: без автоусиления
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.transient_suppression = true    # щелчки клавиатуры
                webrtc.voice_detection = false
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "glass_vega_near_capture"
                target.object = "alsa_input.usb-3142_fifine_Microphone-00.analog-stereo"
                node.passive = true
            }
            source.props = {
                node.name = "glass_vega_near"
                node.description = "Assistant mic, near (noise suppression, echo cancel)"
                priority.session = 90
                priority.driver = 90
            }
        }
    }
]
