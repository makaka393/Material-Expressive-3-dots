# ~/.config/hypr/hyprland.conf
source = ~/.cache/matugen/colors-hyprland.conf

#############
### NVIDIA ###
#############
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = XDG_MENU_PREFIX,plasma-

#############
### MONITOR ###
#############
monitor=,preferred,auto,1

#################
### AUTOSTART ###
#################
env = QT_QPA_PLATFORMTHEME,kde
exec-once = qs -c glass -n
exec-once = qs -c glow -n -d
exec-once = spotify
exec-once = zen-browser
#exec-once = openrgb
# (уведомления теперь в баре) exec-once = dunst
exec-once = nm-applet --indicator
exec-once = awww-daemon
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=Hyprland
exec-once = systemctl --user start sunshine

#############
### INPUT ###
#############
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

###############
### GENERAL ###
###############
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $color2 $color4 45deg
    col.inactive_border = $color0
    layout = dwindle
    allow_tearing = true
}

#################
### DECORATION ###
#################

decoration {
    rounding = 20

    blur {
        enabled = true
        size = 2
        passes = 4
        vibrancy = 0.2
        noise = 0.1
	vibrancy_darkness = 0.3
    }

    active_opacity = 0.80
    inactive_opacity = 0.70

    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(00000088)
    }
}


###############
### ANIMATIONS ###
###############
animations {
    enabled = true
    # кривые M3 Expressive — те же, что у оболочки (quickshell/glass/Theme.qml):
    # окна и рабочие столы двигаются «пружинкой», прозрачность и рамки — без отскока
    bezier = m3spatial, 0.38, 1.21, 0.22, 1.00
    bezier = m3effects, 0.34, 0.80, 0.34, 1.00
    bezier = m3exit, 0.30, 0.00, 0.80, 0.15
    animation = windowsIn, 1, 5, m3spatial, popin 86%
    animation = windowsOut, 1, 2.2, m3exit, popin 90%
    animation = windowsMove, 1, 4.5, m3spatial
    animation = border, 1, 3, m3effects
    animation = fade, 1, 2.5, m3effects
    animation = workspaces, 1, 4.5, m3spatial, slide
}

#############
### LAYOUT ###
#############
dwindle {
 #   pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

#################
### GESTURES ###
#################
gestures {
#    workspace_swipe = true
}

#############
### MISC ###
#############
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # оболочка может перехватить замок экрана после своего перезапуска (quickshell/glass/Locker.qml)
    allow_session_lock_restore = true
}

render {
    # полноэкранные игры идут на монитор мимо композитора
    direct_scanout = 2
}

#####################
### WINDOW RULES ###
#####################
windowrule = suppress_event maximize, match:class .*

#############
### BINDS ###
#############
$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

# базовые
bind = $mainMod, Return, exec, ~/.config/hypr/scripts/nofs.sh bash -c "pw-play --volume 0.2 /home/we8lis4jw/Downloads/audiomass-output.wav & kitty"
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, ~/.config/hypr/scripts/nofs.sh $fileManager
bind = $mainMod, V, exec, ~/.config/hypr/scripts/nofs.sh hyprctl dispatch togglefloating
bind = $mainMod, D, exec, ~/.config/hypr/scripts/nofs.sh $menu
bind = $mainMod, P, pseudo,
#bind = $mainMod, J, togglesplit,
bind = $mainMod, F, fullscreen,
# экран блокировки оболочки (Super+L занят переходом фокуса вправо, hyprlock не установлен)
bind = $mainMod, Escape, exec, qs ipc -c glass call lock lock
# шпаргалка по горячим клавишам
bind = $mainMod, slash, exec, ~/.config/hypr/scripts/nofs.sh qs ipc -c glass call hotkeys toggle

#Сторонние ПО
# было (rofi): bind = $mainMod, SPACE, exec, rofi -show drun
bind = $mainMod, SPACE, exec, ~/.config/hypr/scripts/nofs.sh qs ipc -c glass call launcher toggle
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh region

# фокус по стрелкам/hjkl
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# переключение воркспейсов 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# перемещение окна на воркспейс
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# свайп воркспейсов колесом + спецсимвол
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# мышь: двигать/ресайзить окна
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# медиа/звук/яркость
bindl = , XF86AudioMute, exec, pamixer -t
bindl = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Управление громкостью (роллер вверх/вниз/пауза)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, playerctl play-pause


# ── glass bar (quickshell) ──
layerrule = match:namespace quickshell-bar, blur on, blur_popups on, ignore_alpha 0.01, no_anim on
layerrule = match:namespace rofi, blur on, ignore_alpha 0.3

# выбор обоев (glass)
bind = $mainMod, W, exec, ~/.config/hypr/scripts/nofs.sh qs ipc -c glass call picker toggle

# ── мягкое появление rofi и других окон-слоёв (glass) ──
bezier = softBounce, 0.34, 1.45, 0.64, 1
bezier = smoothOut, 0.36, 0, 0.66, -0.56
animation = layersIn, 1, 4, softBounce, popin 88%
animation = layersOut, 1, 2.5, smoothOut, popin 92%
animation = fadeLayersIn, 1, 2.5, default
animation = fadeLayersOut, 1, 2, default
exec-once = sleep 1 && ~/.config/hypr/scripts/changetheme.sh --restore
windowrule = match:class org.kde.dolphin, opacity 0.95 0.9

# Steam Big Picture — всегда во весь экран
windowrule = match:class steam, match:title Steam Big Picture Mode, fullscreen on

# CS2 — без vsync композитора (tearing), меньше инпут-лаг
windowrule = match:class cs2, immediate on
bind = SUPER SHIFT, A, exec, ~/.config/hypr/scripts/screenshot.sh pretty
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh full
layerrule = match:namespace selection, no_anim on
layerrule = match:namespace quickshell-glow, no_anim on
exec-once = ~/.config/hypr/scripts/shake-lens.py
bind = SUPER SHIFT, G, exec, ~/.config/hypr/scripts/screenshot.sh lens

# запись экрана (меню в баре / стоп)
bind = SUPER ALT, R, exec, ~/.config/hypr/scripts/record.sh toggle

# окно настроек: блюр под стеклом (затемнение фона не размывается)
layerrule = match:namespace quickshell-settings, blur on, ignore_alpha 0.22

# лаунчер в стекле (вместо rofi)
layerrule = match:namespace quickshell-launcher, blur on, ignore_alpha 0.22
bind = SUPER, PERIOD, exec, ~/.config/hypr/scripts/nofs.sh qs ipc -c glass call launcher emoji
